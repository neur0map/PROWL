version: 2

project_name: prowl

before:
  hooks:
    - go mod tidy
    - rm -rf completions manpages
    - mkdir -p completions manpages
    - sh -c 'go run . completion bash >./completions/prowl.bash'
    - sh -c 'go run . completion zsh >./completions/prowl.zsh'
    - sh -c 'go run . completion fish >./completions/prowl.fish'
    - sh -c 'go run . man | gzip -c >./manpages/prowl.1.gz'

builds:
  - id: prowl
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/neur0map/prowl/internal/version.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      prowl_
      {{- .Version }}_
      Linux_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE.md
      - NOTICE.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

source:
  enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^(build|ci|test)(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"

release:
  prerelease: auto
