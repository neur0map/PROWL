name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@4afd733a84b1f43292c63897423277bb7f4313a9 # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
